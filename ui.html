<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minrag — Chat with your PDFs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f5f7;
      --surface:      #ffffff;
      --navbar-bg:    rgba(255,255,255,0.72);
      --text:         #1d1d1f;
      --text-sec:     #6e6e73;
      --accent:       #0071e3;
      --accent-hover: #0077ed;
      --accent-text:  #ffffff;
      --border:       rgba(0,0,0,0.08);
      --shadow-sm:    0 2px 12px rgba(0,0,0,0.06);
      --shadow-md:    0 4px 24px rgba(0,0,0,0.10);
      --green:        #34c759;
      --amber:        #ff9f0a;
      --red:          #ff3b30;
      --radius-pill:  999px;
      --radius-card:  18px;
      --radius-input: 14px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Navbar ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: var(--navbar-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      z-index: 100;
    }

    .nav-logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      flex: 1;
    }
    .nav-logo span { color: var(--accent); }

    .nav-actions { display: flex; align-items: center; gap: 10px; }

    select#pdf-select {
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select#pdf-select:focus { border-color: var(--accent); }

    .btn {
      height: 34px;
      padding: 0 16px;
      border: none;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--text-sec);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface); color: var(--text); }

    #sidebar-toggle { display: none; }

    /* ── Sidebar ── */
    :root { --sidebar-w: 264px; }

    #sidebar {
      position: fixed;
      top: 56px; bottom: 0; left: 0;
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 90;
      transition: transform 0.25s ease;
    }

    #new-chat-btn {
      margin: 14px 14px 8px;
      width: calc(100% - 28px);
      justify-content: center;
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .conv-item:hover { background: var(--bg); }
    .conv-item.active { background: rgba(0,113,227,0.08); }
    .conv-item.active .conv-title { color: var(--accent); }

    .conv-title {
      flex: 1;
      font-size: 13.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-delete {
      flex: none;
      width: 22px; height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--text-sec);
      font-size: 15px;
      cursor: pointer;
      line-height: 1;
    }
    .conv-item:hover .conv-delete { display: flex; }
    .conv-delete:hover { background: rgba(255,59,48,0.12); color: var(--red); }

    .conv-empty {
      padding: 20px 14px;
      font-size: 12.5px;
      color: var(--text-sec);
      text-align: center;
    }

    #sidebar-backdrop { display: none; }

    /* ── Main panel (chat + input), offset for the sidebar ── */
    #main-panel { margin-left: var(--sidebar-w); }

    /* ── Chat area ── */
    #chat-area {
      margin-top: 56px;
      min-height: calc(100vh - 56px - 90px);
      padding: 32px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 20px;
      padding-right: 20px;
    }

    @media (max-width: 860px) {
      #sidebar-toggle { display: flex; }
      #main-panel { margin-left: 0; }
      #sidebar {
        transform: translateX(-100%);
        box-shadow: 0 0 0 9999px transparent;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      #sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 24px rgba(0,0,0,0.12);
      }
      #sidebar-backdrop {
        position: fixed; inset: 56px 0 0 0;
        background: rgba(0,0,0,0.25);
        z-index: 85;
      }
      #sidebar-backdrop.open { display: block; }
      #bottom-bar { left: 0 !important; }
    }

    /* welcome */
    .welcome {
      text-align: center;
      padding: 60px 20px;
      animation: fadeUp 0.5s ease both;
    }
    .welcome-icon {
      width: 64px; height: 64px;
      background: var(--accent);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(0,113,227,0.25);
    }
    .welcome h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .welcome p { color: var(--text-sec); font-size: 15px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
    }
    .suggestion-pill {
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 13px;
      color: var(--text-sec);
      cursor: pointer;
      transition: all 0.2s;
    }
    .suggestion-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,113,227,0.04);
    }

    /* ── Messages ── */
    .msg-row {
      display: flex;
      animation: fadeUp 0.3s ease both;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot  { justify-content: flex-start; }

    /* user bubble */
    .bubble-user {
      max-width: 72%;
      background: var(--accent);
      color: #fff;
      padding: 12px 18px;
      border-radius: 20px 20px 6px 20px;
      font-size: 15px;
      line-height: 1.5;
      box-shadow: 0 2px 12px rgba(0,113,227,0.25);
    }

    /* bot card */
    .card-bot {
      max-width: 88%;
      background: var(--surface);
      border-radius: 6px 20px 20px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-body { padding: 16px 18px; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 10px;
    }

    .msg-copy-btn {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-sec);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .msg-copy-btn:hover { color: var(--text); background: var(--bg); }

    .mode-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .mode-query      { background: rgba(0,113,227,0.08); color: var(--accent); }
    .mode-hypothesis { background: rgba(52,199,89,0.10); color: #248a3d; }

    .answer-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
    }
    .answer-text p { margin: 0 0 10px; }
    .answer-text p:last-child { margin-bottom: 0; }
    .answer-text strong { font-weight: 700; }
    .answer-text em { font-style: italic; }
    .answer-text ul, .answer-text ol { margin: 0 0 10px 20px; padding: 0; }
    .answer-text li { margin-bottom: 4px; }
    .answer-text code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.87em;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.1em 0.4em;
      border-radius: 5px;
    }
    .answer-text pre {
      background: #1d1d1f;
      color: #f2f2f2;
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0 0 10px;
      position: relative;
    }
    .answer-text pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 12.5px;
      line-height: 1.55;
      color: inherit;
    }
    .code-copy-btn {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(255,255,255,0.1);
      color: #f2f2f2;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-family: inherit;
      padding: 4px 8px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.15s;
    }
    .code-copy-btn:hover { opacity: 1; }

    /* hypothesis blocks */
    .hyp-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hyp-item {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .hyp-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    .hyp-bar-wrap {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .hyp-bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.8s ease;
    }

    /* card footer */
    .card-footer {
      padding: 10px 18px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .source-pill {
      font-size: 11px;
      padding: 3px 10px;
      background: var(--bg);
      border-radius: var(--radius-pill);
      color: var(--text-sec);
      border: 1px solid var(--border);
    }
    .conf-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      margin-left: auto;
    }
    .conf-high   { background: rgba(52,199,89,0.12);  color: #248a3d; }
    .conf-medium { background: rgba(255,159,10,0.12); color: #b25000; }
    .conf-low    { background: rgba(255,59,48,0.10);  color: #c00; }

    /* citation cards — the exact retrieved passage behind an answer */
    .citations-block { padding: 0 18px 14px; }
    .citations-toggle {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 0;
      font-family: inherit;
    }
    .citations-toggle:hover { text-decoration: underline; }
    .citations-list { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .citations-list[hidden] { display: none; }
    .citation-card {
      background: var(--bg);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 8px 12px;
    }
    .citation-quote {
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text);
      font-style: italic;
    }
    .citation-src {
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-sec);
    }

    /* thinking */
    .thinking-dots {
      display: flex; gap: 5px; padding: 14px 18px; align-items: center;
    }
    .thinking-dots span {
      width: 7px; height: 7px;
      background: var(--text-sec);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ── Bottom bar ── */
    #bottom-bar {
      position: fixed;
      bottom: 0; left: var(--sidebar-w); right: 0;
      padding: 12px 20px 20px;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
    }

    .input-wrap {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 10px 10px 18px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: transparent;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: #b0b0b5; }

    .input-actions { display: flex; gap: 8px; align-items: center; }

    #clear-btn {
      width: 36px; height: 36px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }

    #send-btn {
      width: 36px; height: 36px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 16px;
    }

    /* ── Upload Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px;
      width: 440px;
      max-width: 95vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      transform: scale(0.96) translateY(8px);
      transition: transform 0.25s ease;
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }

    .modal h2 {
      font-size: 19px; font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .modal-sub { font-size: 13px; color: var(--text-sec); margin-bottom: 20px; }

    .drop-zone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-card);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg);
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(0,113,227,0.04);
    }
    .drop-icon { font-size: 32px; margin-bottom: 10px; }
    .drop-text { font-size: 14px; color: var(--text-sec); }
    .drop-text strong { color: var(--accent); }

    #file-input { display: none; }

    .file-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 160px;
      overflow-y: auto;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 10px;
      font-size: 13px;
    }
    .file-item-name { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item-size { color: var(--text-sec); font-size: 12px; }
    .ingested-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--bg);
      margin-bottom: 6px;
      font-size: 13px;
    }
    .ingested-item-name { flex: 1; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ingested-delete {
      background: none;
      border: none;
      color: var(--text-sec);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    .ingested-delete:hover { background: rgba(255,59,48,0.1); color: var(--red); }
    .file-remove {
      background: none; border: none; color: var(--text-sec);
      cursor: pointer; font-size: 16px; line-height: 1;
      transition: color 0.2s; padding: 0;
    }
    .file-remove:hover { color: var(--red); }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* toast */
    #toast {
      position: fixed;
      bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 300;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%,80%,100% { transform: scale(0); }
      40%         { transform: scale(1); }
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 999;
      transition: opacity 0.5s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .loading-logo span { color: var(--accent); }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      font-size: 14px;
      color: var(--text-sec);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav>
  <button class="btn btn-ghost" id="sidebar-toggle" onclick="toggleSidebar()" title="Conversations">☰</button>
  <div class="nav-logo">min<span>rag</span></div>
  <div class="nav-actions">
    <select id="pdf-select">
      <option value="">All PDFs</option>
    </select>
    <button class="btn btn-ghost" onclick="openUpload()">
      ↑ Upload PDF
    </button>
  </div>
</nav>

<!-- ── Sidebar: conversation threads ── -->
<div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>
<aside id="sidebar">
  <button class="btn btn-primary" id="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
  <div class="conv-list" id="conv-list">
    <div class="conv-empty">No conversations yet</div>
  </div>
</aside>

<!-- ── Main panel: chat + input ── -->
<div id="main-panel">
  <div id="chat-area">
    <div class="welcome" id="welcome">
      <h1>Chat with your PDFs</h1>
      <p>Ask anything — minrag finds the answer from your documents.</p>
    </div>
  </div>

  <div id="bottom-bar">
    <div class="input-wrap">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ask anything about your documents..."
      ></textarea>
      <div class="input-actions">
        <button class="btn btn-ghost" id="clear-btn" title="Clear this conversation" onclick="clearHistory()">↺</button>
        <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Upload Modal ── -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal">
    <h2>Upload PDFs</h2>
    <p class="modal-sub">Drop your PDF files to make them searchable.</p>

    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="drop-icon">📄</div>
      <div class="drop-text"><strong>Click to browse</strong> or drag and drop</div>
      <div class="drop-text" style="margin-top:4px;font-size:12px;">PDF files only</div>
    </div>
    <input type="file" id="file-input" accept=".pdf" multiple />

    <div class="file-list" id="file-list"></div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeUpload()">Cancel</button>
      <button class="btn btn-primary" id="upload-btn" onclick="uploadFiles()">Upload & Ingest</button>
    </div>

    <div id="ingested-section" style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px;display:none">
      <div style="font-size:12px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">Ingested PDFs</div>
      <div id="ingested-list"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Loading overlay — visible until models are ready -->
<div id="loading-overlay">
  <div class="loading-logo">min<span>rag</span></div>
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Loading AI models...</div>
</div>

<script>
  const API = 'http://127.0.0.1:8000';
  let selectedFiles = [];

  // ── Active conversation (persisted across reloads via localStorage) ──
  let activeConversationId = localStorage.getItem('minrag_active_conversation') || crypto.randomUUID();
  localStorage.setItem('minrag_active_conversation', activeConversationId);

  // ── Wait for models to load, then hide the loading screen ──
  (async function waitForReady() {
    const overlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    let dots = 0;
    const dotInterval = setInterval(() => {
      dots = (dots + 1) % 4;
      loadingText.textContent = 'Loading AI models' + '.'.repeat(dots);
    }, 500);

    while (true) {
      try {
        const res = await fetch(`${API}/health`);
        if (res.ok) {
          clearInterval(dotInterval);
          loadingText.textContent = 'Ready!';
          overlay.classList.add('hidden');
          setTimeout(() => overlay.remove(), 500);
          await loadSources();
          await loadConversationSidebar();
          await resumeActiveConversation();
          return;
        }
      } catch {}
      await new Promise(r => setTimeout(r, 1000));
    }
  })();

  // ── Auto-resize textarea ──
  const input = document.getElementById('user-input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Load PDF sources ──
  async function loadSources() {
    try {
      const res = await fetch(`${API}/sources`);
      const data = await res.json();
      const sel = document.getElementById('pdf-select');
      sel.innerHTML = '<option value="">All PDFs</option>';
      data.sources.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sel.appendChild(opt);
      });
    } catch { /* server not ready */ }
  }

  // ── Conversation sidebar ──
  function toggleSidebar(force) {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('sidebar-backdrop');
    const open = force !== undefined ? force : !sb.classList.contains('open');
    sb.classList.toggle('open', open);
    bd.classList.toggle('open', open);
  }

  async function loadConversationSidebar() {
    try {
      const res = await fetch(`${API}/conversations`);
      const data = await res.json();
      renderConversationList(data.conversations || []);
    } catch { /* server not ready */ }
  }

  function renderConversationList(conversations) {
    const list = document.getElementById('conv-list');
    if (!conversations.length) {
      list.innerHTML = '<div class="conv-empty">No conversations yet</div>';
      return;
    }
    list.innerHTML = conversations.map(c => `
      <div class="conv-item ${c.id === activeConversationId ? 'active' : ''}" onclick="switchConversation('${c.id}')">
        <span class="conv-title" title="${escHtml(c.title)}">${escHtml(c.title)}</span>
        <button class="conv-delete" onclick="deleteConversationUI(event, '${c.id}')" title="Delete">×</button>
      </div>`).join('');
  }

  function setActiveConversation(id) {
    activeConversationId = id;
    localStorage.setItem('minrag_active_conversation', id);
  }

  function startNewChat() {
    setActiveConversation(crypto.randomUUID());
    showWelcomeScreen();
    loadConversationSidebar();
    toggleSidebar(false);
  }

  async function switchConversation(id) {
    if (id === activeConversationId && chatArea().querySelector('.msg-row')) {
      toggleSidebar(false);
      return;
    }
    setActiveConversation(id);
    try {
      const res = await fetch(`${API}/conversations/${encodeURIComponent(id)}/messages`);
      const data = await res.json();
      renderStoredMessages(data.messages || []);
    } catch {
      showToast('Could not load that conversation');
    }
    loadConversationSidebar();
    toggleSidebar(false);
  }

  async function deleteConversationUI(event, id) {
    event.stopPropagation();
    if (!confirm('Delete this conversation?')) return;
    try {
      await fetch(`${API}/conversations/${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (id === activeConversationId) {
        setActiveConversation(crypto.randomUUID());
        showWelcomeScreen();
      }
      await loadConversationSidebar();
    } catch {
      showToast('Delete failed — is the server running?');
    }
  }

  async function resumeActiveConversation() {
    try {
      const res = await fetch(`${API}/conversations/${encodeURIComponent(activeConversationId)}/messages`);
      const data = await res.json();
      if (data.messages && data.messages.length) {
        renderStoredMessages(data.messages);
      }
    } catch { /* brand new conversation, nothing to resume */ }
  }

  function showWelcomeScreen() {
    chatArea().innerHTML = `
      <div class="welcome" id="welcome">
        <h1>Chat with your PDFs</h1>
        <p>Ask anything — minrag finds the answer from your documents.</p>
      </div>`;
  }

  function renderStoredMessages(messages) {
    chatArea().innerHTML = '';
    if (!messages.length) { showWelcomeScreen(); return; }
    messages.forEach(m => {
      if (m.role === 'user') {
        appendUser(m.content);
      } else {
        appendStoredAnswer(m.content);
      }
    });
    scrollBottom();
  }

  function appendStoredAnswer(text) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="card-bot">
        <div class="card-body">
          <div class="card-header">
            <button class="msg-copy-btn" title="Copy response">⧉</button>
            <span class="mode-tag mode-query">Query</span>
          </div>
          <div class="answer-text">${renderMarkdown(text)}</div>
        </div>
      </div>`;
    chatArea().appendChild(row);
    row.querySelector('.msg-copy-btn').addEventListener('click', (e) => copyAnswerText(e.currentTarget, text));
  }

  // ── Suggestion pills ──
  function useSuggestion(el) {
    input.value = el.textContent;
    input.style.height = 'auto';
    sendMessage();
  }

  // ── Send message ──
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';

    hideWelcome();
    appendUser(text);

    const source = document.getElementById('pdf-select').value || null;
    const isHypothesis = detectHypothesis(text);

    if (isHypothesis) {
      await sendHypothesis(text, source);
    } else {
      await sendStream(text, source);
    }

    scrollBottom();
    loadConversationSidebar();
  }

  // ── Hypothesis (non-streaming) ──
  async function sendHypothesis(text, source) {
    const thinkCard = appendThinking();
    try {
      const res = await fetch(`${API}/solve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ problem: text, source }),
      });
      thinkCard.remove();
      if (!res.ok) { const e = await res.json(); appendError(e.detail || 'Something went wrong.'); return; }
      appendHypothesis((await res.json()).analysis);
    } catch {
      thinkCard.remove();
      appendError('Could not reach the API. Make sure the server is running.');
    }
  }

  // ── Streaming chat ──
  async function sendStream(text, source) {
    const thinkCard = appendThinking();
    let answerEl = null;
    let cardRow   = null;

    try {
      const res = await fetch(`${API}/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text, conversation_id: activeConversationId, source, top_k: 5 }),
      });

      if (!res.ok) {
        thinkCard.remove();
        try {
          const err = await res.json();
          appendError(err.detail || `Error ${res.status}: Something went wrong.`);
        } catch {
          appendError(`Error ${res.status}: Something went wrong.`);
        }
        return;
      }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let lastEvent = 'message';
      let rawAnswer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep last incomplete line

        for (const line of lines) {
          if (line.startsWith('event: ')) {
            lastEvent = line.slice(7).trim();
          } else if (line.startsWith('data: ')) {
            const raw = line.slice(6);

            if (lastEvent === 'error') {
              thinkCard.remove();
              appendError(JSON.parse(raw));
              return;
            }

            if (lastEvent === 'done') break;

            if (lastEvent === 'meta') {
              const meta = JSON.parse(raw);
              if (cardRow) addStreamFooter(cardRow, meta.sources, meta.confidence, meta.citations, rawAnswer);
            } else {
              // first token — replace thinking card with streaming card
              if (!answerEl) {
                thinkCard.remove();
                ({ answerEl, cardRow } = appendStreamCard());
              }
              rawAnswer += JSON.parse(raw);
              answerEl.innerHTML = renderMarkdown(rawAnswer);
              scrollBottom();
            }
            lastEvent = 'message';
          }
        }
      }
    } catch (e) {
      if (thinkCard.parentNode) thinkCard.remove();
      appendError('Could not reach the API: ' + (e?.message || 'unknown error. Make sure the server is running.'));
    }
  }

  function appendStreamCard() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="card-bot">
        <div class="card-body">
          <div class="card-header"><span class="mode-tag mode-query">Query</span></div>
          <div class="answer-text"></div>
        </div>
        <div class="card-footer"></div>
      </div>`;
    chatArea().appendChild(row);
    return { cardRow: row, answerEl: row.querySelector('.answer-text') };
  }

  function addStreamFooter(row, sources, confidence, citations, answerText) {
    const confClass = confidence.includes('High') ? 'conf-high'
                    : confidence.includes('Medium') ? 'conf-medium' : 'conf-low';
    const pills = (sources || []).map(s => `<span class="source-pill">📄 ${escHtml(s)}</span>`).join('');
    row.querySelector('.card-footer').innerHTML =
      `${pills}<span class="conf-pill ${confClass}">◉ ${escHtml(confidence)}</span>`;

    const header = row.querySelector('.card-header');
    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-copy-btn';
    copyBtn.title = 'Copy response';
    copyBtn.textContent = '⧉';
    copyBtn.addEventListener('click', (e) => copyAnswerText(e.currentTarget, answerText));
    header.insertBefore(copyBtn, header.firstChild);

    if (citations && citations.length) {
      row.querySelector('.card-bot').insertAdjacentHTML('beforeend', citationsBlockHtml(citations));
    }
  }

  function citationsBlockHtml(citations) {
    const cards = citations.map(c => `
      <div class="citation-card">
        <div class="citation-quote">"${escHtml(c.text)}"</div>
        <div class="citation-src">📄 ${escHtml(c.source)} · p.${c.page}</div>
      </div>`).join('');
    const label = citations.length === 1 ? '1 source passage' : `${citations.length} source passages`;
    return `
      <div class="citations-block">
        <button class="citations-toggle" onclick="toggleCitations(this)">▾ Show ${label}</button>
        <div class="citations-list" hidden>${cards}</div>
      </div>`;
  }

  function toggleCitations(btn) {
    const list = btn.nextElementSibling;
    const opening = list.hasAttribute('hidden');
    if (opening) list.removeAttribute('hidden'); else list.setAttribute('hidden', '');
    btn.textContent = btn.textContent.replace(opening ? '▾' : '▴', opening ? '▴' : '▾');
  }

  function copyAnswerText(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      const old = btn.textContent;
      btn.textContent = '✓';
      setTimeout(() => { btn.textContent = old; }, 1200);
    });
  }

  // ── Detect hypothesis mode ──
  function detectHypothesis(text) {
    const t = text.toLowerCase().trim();
    if (t.startsWith('solve:')) return true;
    const first = t.split(' ')[0];
    if (first === 'why') return true;
    const twoWord = t.split(' ').slice(0, 2).join(' ');
    return ['how come','what causes','what caused','explain why','how could','what makes'].includes(twoWord);
  }

  // ── DOM helpers ──
  function hideWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function appendUser(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="bubble-user">${escHtml(text)}</div>`;
    chatArea().appendChild(row);
    scrollBottom();
  }

  function appendThinking() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="card-bot">
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
      </div>`;
    chatArea().appendChild(row);
    scrollBottom();
    return row;
  }

  function appendAnswer(answer, sources, confidence) {
    const confClass = confidence.includes('High') ? 'conf-high'
                    : confidence.includes('Medium') ? 'conf-medium' : 'conf-low';

    const sourcePills = (sources || []).map(s =>
      `<span class="source-pill">📄 ${escHtml(s)}</span>`
    ).join('');

    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="card-bot">
        <div class="card-body">
          <div class="card-header">
            <span class="mode-tag mode-query">Query</span>
          </div>
          <div class="answer-text">${renderMarkdown(answer)}</div>
        </div>
        <div class="card-footer">
          ${sourcePills}
          <span class="conf-pill ${confClass}">◉ ${escHtml(confidence)}</span>
        </div>
      </div>`;
    chatArea().appendChild(row);
  }

  function appendHypothesis(analysis) {
    const lines = analysis.split('\n');
    const hypLines = [];
    const verdictLines = [];
    let inVerdict = false;

    lines.forEach(l => {
      if (l.includes('VERDICT')) { inVerdict = true; return; }
      if (inVerdict) verdictLines.push(l);
      else if (l.match(/^[✅⚠❌]/)) hypLines.push(l);
    });

    const hypHTML = hypLines.map(l => {
      const pctMatch = l.match(/(\d+(\.\d+)?)%/);
      const pct = pctMatch ? parseFloat(pctMatch[1]) : 0;
      const label = l.replace(/^[✅⚠❌]\s*/, '').replace(/\d+(\.\d+)?%\s*\[.*?\]\s*/, '').trim();
      const color = pct >= 70 ? 'var(--green)' : pct >= 35 ? 'var(--amber)' : 'var(--red)';
      const barWidth = pct > 0 ? pct : 2;
      const icon = pct >= 70 ? '✅' : pct >= 35 ? '⚠️' : '❌';
      return `
        <div class="hyp-item">
          <div class="hyp-label">${icon} ${escHtml(label)}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            <div class="hyp-bar-wrap" style="flex:1">
              <div class="hyp-bar" style="width:${barWidth}%;background:${pct>0?color:'var(--border)'}"></div>
            </div>
            <span style="font-size:12px;font-weight:600;color:${pct>0?color:'var(--text-sec)'};min-width:36px;text-align:right">${pct}%</span>
          </div>
        </div>`;
    }).join('');

    const verdict = verdictLines.join('\n').trim();

    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="card-bot">
        <div class="card-body">
          <div class="card-header">
            <button class="msg-copy-btn" title="Copy response">⧉</button>
            <span class="mode-tag mode-hypothesis">Hypothesis</span>
          </div>
          <div class="hyp-list">${hypHTML}</div>
          ${verdict ? `
          <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
            <div style="font-size:12px;font-weight:600;color:var(--text-sec);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">Verdict</div>
            <div class="answer-text">${renderMarkdown(verdict)}</div>
          </div>` : ''}
        </div>
      </div>`;
    chatArea().appendChild(row);
    row.querySelector('.msg-copy-btn').addEventListener('click', (e) => copyAnswerText(e.currentTarget, analysis));
  }

  function appendError(msg) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="card-bot" style="border-color:rgba(255,59,48,0.2)">
        <div class="card-body">
          <div style="color:var(--red);font-size:14px;">⚠ ${escHtml(msg)}</div>
        </div>
      </div>`;
    chatArea().appendChild(row);
  }

  // ── Clear history ──
  async function clearHistory() {
    try {
      await fetch(`${API}/conversations/${encodeURIComponent(activeConversationId)}`, { method: 'DELETE' });
      await fetch(`${API}/solve-history`, { method: 'DELETE' });
    } catch {}
    setActiveConversation(crypto.randomUUID());
    showWelcomeScreen();
    showToast('Conversation cleared');
    loadConversationSidebar();
  }

  // ── Upload modal ──
  function openUpload() {
    document.getElementById('upload-modal').classList.add('open');
    selectedFiles = [];
    renderFileList();
    loadIngestedInModal();
  }
  function closeUpload() {
    document.getElementById('upload-modal').classList.remove('open');
    selectedFiles = [];
    renderFileList();
  }

  async function loadIngestedInModal() {
    try {
      const res = await fetch(`${API}/sources`);
      const data = await res.json();
      const section = document.getElementById('ingested-section');
      const list = document.getElementById('ingested-list');
      if (!data.sources.length) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      list.innerHTML = data.sources.map(s => `
        <div class="ingested-item" id="ingested-${CSS.escape(s)}">
          <span style="font-size:16px;">📄</span>
          <span class="ingested-item-name" title="${escHtml(s)}">${escHtml(s)}</span>
          <button class="ingested-delete" onclick="deletePdf('${escHtml(s)}')" title="Delete">×</button>
        </div>`).join('');
    } catch { /* server not ready */ }
  }

  async function deletePdf(name) {
    if (!confirm(`Delete "${name}" from the system?`)) return;
    try {
      const res = await fetch(`${API}/sources/${encodeURIComponent(name)}`, { method: 'DELETE' });
      if (res.ok) {
        showToast(`✓ Deleted ${name}`);
        await loadSources();
        await loadIngestedInModal();
      } else {
        showToast('Delete failed');
      }
    } catch {
      showToast('Delete failed — is the server running?');
    }
  }

  document.getElementById('file-input').addEventListener('change', e => {
    addFiles(Array.from(e.target.files));
  });

  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles(Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.pdf')));
  });

  function addFiles(files) {
    files.forEach(f => {
      if (!selectedFiles.find(x => x.name === f.name)) selectedFiles.push(f);
    });
    renderFileList();
  }

  function renderFileList() {
    const list = document.getElementById('file-list');
    list.innerHTML = selectedFiles.map((f, i) => `
      <div class="file-item">
        <span style="font-size:18px;">📄</span>
        <span class="file-item-name">${escHtml(f.name)}</span>
        <span class="file-item-size">${(f.size/1024).toFixed(0)} KB</span>
        <button class="file-remove" onclick="removeFile(${i})">×</button>
      </div>`).join('');
  }

  function removeFile(i) {
    selectedFiles.splice(i, 1);
    renderFileList();
  }

  async function uploadFiles() {
    if (!selectedFiles.length) { showToast('No files selected'); return; }
    const btn = document.getElementById('upload-btn');
    btn.textContent = 'Uploading...';
    btn.disabled = true;

    const form = new FormData();
    selectedFiles.forEach(f => form.append('files', f));

    try {
      const res = await fetch(`${API}/ingest`, { method: 'POST', body: form });
      const data = await res.json();
      closeUpload();
      await loadSources();
      showToast(`✓ Ingested ${data.ingested.length} PDF(s)`);
    } catch {
      showToast('Upload failed — is the server running?');
    } finally {
      btn.textContent = 'Upload & Ingest';
      btn.disabled = false;
    }
  }

  // ── Close modal on overlay click ──
  document.getElementById('upload-modal').addEventListener('click', function(e) {
    if (e.target === this) closeUpload();
  });

  // ── Toast ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // ── Utils ──
  function chatArea() { return document.getElementById('chat-area'); }
  function scrollBottom() {
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 50);
  }
  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // ── Minimal Markdown renderer (bold, italic, lists, code) ──
  // Escapes first, so nothing the model writes can inject real HTML — only
  // the markdown syntax we explicitly recognize turns into tags.
  function renderMarkdown(raw) {
    const codeBlocks = [];
    const inlineCodes = [];
    let text = escHtml(raw);

    // Fenced code blocks — pulled out first so nothing inside them (```* item```
    // etc.) gets mangled by the list/bold rules below.
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const i = codeBlocks.length;
      codeBlocks.push({ lang: lang.trim(), code: code.replace(/\n$/, '') });
      return ` CODEBLOCK${i} `;
    });

    // Inline code
    text = text.replace(/`([^`\n]+)`/g, (_, code) => {
      const i = inlineCodes.length;
      inlineCodes.push(code);
      return ` INLINECODE${i} `;
    });

    // Bold, then italic
    text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    text = text.replace(/(?<![\w ])_([^_\n]+)_(?![\w ])/g, '<em>$1</em>');

    // Line-by-line: paragraphs + bullet/numbered lists + standalone code blocks
    const lines = text.split('\n');
    const out = [];
    let listType = null;
    let para = [];

    const flushPara = () => { if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = []; } };
    const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };

    for (const line of lines) {
      const trimmed = line.trim();
      const codeLine = trimmed.match(/^CODEBLOCK(\d+)$/);
      const bullet = trimmed.match(/^[-*]\s+(.*)/);
      const numbered = trimmed.match(/^\d+\.\s+(.*)/);

      if (codeLine) {
        closeList(); flushPara();
        out.push(trimmed);
      } else if (bullet) {
        flushPara();
        if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
        out.push(`<li>${bullet[1]}</li>`);
      } else if (numbered) {
        flushPara();
        if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
        out.push(`<li>${numbered[1]}</li>`);
      } else if (trimmed === '') {
        closeList(); flushPara();
      } else {
        closeList();
        para.push(line);
      }
    }
    closeList(); flushPara();
    text = out.join('');

    text = text.replace(/ INLINECODE(\d+) /g, (_, i) => `<code>${inlineCodes[+i]}</code>`);
    text = text.replace(/CODEBLOCK(\d+)/g, (_, i) => {
      const { code } = codeBlocks[+i];
      const btnId = 'copy_' + Math.random().toString(36).slice(2);
      return `<pre><button class="code-copy-btn" id="${btnId}" onclick="copyCode(this,'${btnId}')">Copy</button><code>${code}</code></pre>`;
    });

    return text;
  }

  function copyCode(btn, id) {
    const code = document.getElementById(id).nextElementSibling.textContent;
    navigator.clipboard.writeText(code).then(() => {
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = old; }, 1500);
    });
  }
</script>
</body>
</html>
